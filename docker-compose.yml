services:
  afyaplus:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: afyaplus-service:${APP_VERSION:-1.0.0}
    env_file:
      - .env
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

